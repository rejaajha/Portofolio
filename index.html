        onclick="toggleMenu()"
        class="humberger-icon"
      >
        <i class="fa fa-bars"></i>
      </a>
      <!-- Humberger -->
       <script>
        const menu = document.querySelector('.menu')

        function toggleMenu(){
            if(menu.style.display === 'block'){
                menu.style.display = 'none';
            }else{
                menu.style.display = 'block';
            }
        }
      </script>
